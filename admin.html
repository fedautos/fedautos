<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&D AUTOS | Painel Administrativo</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --brand-orange: #f4813f; 
            --dark-bg: #0b0e11;
            --card-bg: #161b22;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--dark-bg); color: var(--text-white); overflow-x: hidden; padding-top: 100px; }

        /* Header Admin */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 8%; background: rgba(11, 14, 17, 0.98);
            position: fixed; width: 100%; top: 0; z-index: 3000; 
            border-bottom: 2px solid var(--brand-orange); height: 80px;
        }
        .logo-container img { height: 45px; width: auto; }
        .admin-badge { background: var(--brand-orange); color: black; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; margin-left: 10px; text-transform: uppercase; }
        .btn-sair { background: transparent; color: #ff4c4c; border: 1px solid #ff4c4c; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-sair:hover { background: #ff4c4c; color: white; }

        /* Layout Principal */
        .admin-container { padding: 20px 8%; display: flex; flex-direction: column; gap: 40px; }
        
        .section-title { font-size: 1.8rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #2d333b; padding-bottom: 10px; }
        .section-title i { color: var(--brand-orange); }

        /* Formulário */
        .form-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--brand-orange); padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group.full-width { grid-column: 1 / -1; }
        .input-group label { font-weight: bold; color: var(--text-gray); font-size: 0.9rem; }
        
        input, select, textarea {
            padding: 14px; border-radius: 6px; border: 1px solid #2d333b; 
            background: var(--dark-bg); color: white; font-size: 1rem; outline: none; width: 100%; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--brand-orange); box-shadow: 0 0 5px rgba(244,129,63,0.3); }
        textarea { resize: vertical; min-height: 120px; }

        /* Área de Upload de Fotos com Gerenciamento */
        .upload-area {
            border: 2px dashed #2d333b; border-radius: 8px; padding: 40px; text-align: center;
            background: rgba(11, 14, 17, 0.5); cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .upload-area:hover { border-color: var(--brand-orange); background: rgba(244,129,63,0.05); }
        .upload-area i { font-size: 3rem; color: var(--brand-orange); margin-bottom: 15px; }
        .upload-area p { color: var(--text-gray); font-size: 1.1rem; }
        #fotos-input { display: none; }
        
        .preview-fotos { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        .preview-item-wrapper { position: relative; width: 100px; height: 100px; border-radius: 6px; border: 1px solid #2d333b; cursor: grab; overflow: hidden; }
        .preview-item-wrapper.dragging { opacity: 0.5; border-color: var(--brand-orange); }
        .preview-item { width: 100%; height: 100%; object-fit: cover; }
        .btn-remove-foto { position: absolute; bottom: 5px; right: 5px; background: rgba(255, 76, 76, 0.8); color: white; border: none; width: 25px; height: 25px; border-radius: 50%; font-size: 0.8rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-remove-foto:hover { background: #ff4c4c; transform: scale(1.1); }

        /* Botões Form */
        .btn-primario { 
            background: var(--brand-orange); color: #000; padding: 14px 30px; border-radius: 6px; 
            font-weight: bold; transition: 0.3s; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1rem; text-transform: uppercase; width: 100%; margin-top: 20px;
        }
        .btn-primario:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(244,129,63,0.4); }

        /* Lista de Estoque Admin */
        .estoque-admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .admin-card { background: var(--card-bg); border-radius: 8px; border: 1px solid #2d333b; overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .status-badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; border: 1px solid currentColor; z-index: 5; }
        .status-badge.publicado { color: #25d366; }
        .status-badge.rascunho { color: var(--text-gray); }

        .admin-card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 1px solid #2d333b; }
        .admin-card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        .admin-card-body h3 { font-size: 1.1rem; margin-bottom: 5px; color: white; }
        .admin-card-body p { color: var(--brand-orange); font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }
        
        .admin-actions { display: flex; gap: 10px; margin-top: auto; flex-wrap: wrap; }
        .btn-action { flex: 1; min-width: 80px; background: transparent; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 0.85rem; border: 1px solid currentColor; }
        
        .btn-publicar { color: #25d366; }
        .btn-publicar:hover { background: #25d366; color: #000; }
        .btn-despublicar { color: #ff9e22; }
        .btn-despublicar:hover { background: #ff9e22; color: #000; }
        .btn-editar { color: #4da6ff; }
        .btn-editar:hover { background: #4da6ff; color: #000; }
        .btn-excluir { color: #ff4c4c; }
        .btn-excluir:hover { background: #ff4c4c; color: #fff; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container" style="display: flex; align-items: center;">
            <img src="logo.png" alt="F&D AUTOS" onerror="this.style.display='none'">
            <span class="admin-badge">Painel Admin</span>
        </div>
        <a href="index.html" class="btn-sair"><i class="fas fa-sign-out-alt"></i> Voltar ao Site</a>
    </header>

    <main class="admin-container">
        
        <section>
            <h2 class="section-title"><i class="fas fa-plus-circle"></i> Publicar / Editar Anúncio</h2>
            
            <div class="form-card">
                <form id="formVeiculo" onsubmit="salvarVeiculo(event)">
                    <input type="hidden" id="veiculoId"> <div class="form-grid">
                        <div class="input-group">
                            <label>Placa do Veículo (Opcional - Preenchimento Automático)</label>
                            <input type="text" id="placa" placeholder="Ex: ABC1234" maxlength="7" onblur="buscarPorPlaca()">
                            <span id="msgPlaca" style="font-size: 0.8rem; color: #ff9e22; display: none;">Buscando informações...</span>
                        </div>

                        <div class="input-group">
                            <label>Nome do Veículo</label>
                            <input type="text" id="nome" placeholder="Ex: Chevrolet Onix LTZ" required>
                        </div>

                        <div class="input-group">
                            <label>Marca</label>
                            <select id="marca" required>
                                <option value="">Selecione...</option>
                                <option value="Chevrolet">Chevrolet</option>
                                <option value="Citroen">Citroen</option>
                                <option value="Fiat">Fiat</option>
                                <option value="Ford">Ford</option>
                                <option value="Honda">Honda</option>
                                <option value="Hyundai">Hyundai</option>
                                <option value="Jeep">Jeep</option>
                                <option value="Nissan">Nissan</option>
                                <option value="Peugeot">Peugeot</option>
                                <option value="Renault">Renault</option>
                                <option value="Toyota">Toyota</option>
                                <option value="Volkswagen">Volkswagen</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Tipo</label>
                            <select id="tipo" required>
                                <option value="Hatch">Hatch</option>
                                <option value="Sedan">Sedan</option>
                                <option value="SUV">SUV</option>
                                <option value="Picape">Picape</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Preço</label>
                            <input type="text" id="preco" placeholder="Ex: R$ 58.900" required>
                        </div>

                        <div class="input-group">
                            <label>Ano</label>
                            <input type="text" id="ano" placeholder="Ex: 2019/2019" required>
                        </div>

                        <div class="input-group">
                            <label>Quilometragem</label>
                            <input type="text" id="km" placeholder="Ex: 45.000 KM" required>
                        </div>

                        <div class="input-group">
                            <label>Cor</label>
                            <input type="text" id="cor" placeholder="Ex: Prata" required>
                        </div>

                        <div class="input-group">
                            <label>Câmbio</label>
                            <select id="cambio" required>
                                <option value="Automático">Automático</option>
                                <option value="Manual">Manual</option>
                                <option value="CVT">CVT</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Combustível</label>
                            <select id="combustivel" required>
                                <option value="Flex">Flex</option>
                                <option value="Gasolina">Gasolina</option>
                                <option value="Diesel">Diesel</option>
                                <option value="Híbrido">Híbrido</option>
                                <option value="Elétrico">Elétrico</option>
                            </select>
                        </div>

                        <div class="input-group full-width">
                            <label>Descrição Detalhada</label>
                            <textarea id="descricao" placeholder="Escreva os detalhes, opcionais, estado de conservação..."></textarea>
                        </div>
                    </div>

                    <div class="input-group full-width" style="margin-top: 20px;">
                        <label>Fotos do Veículo (Arraste para ordenar)</label>
                        <div class="upload-area" onclick="document.getElementById('fotos-input').click()">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Clique aqui para selecionar as fotos</p>
                            <span style="font-size: 0.85rem; color: #666;">(Você pode selecionar várias fotos de uma vez)</span>
                        </div>
                        <input type="file" id="fotos-input" multiple accept="image/*" onchange="previewImagens(event)">
                        
                        <div class="preview-fotos" id="preview-container"></div>
                    </div>

                    <button type="submit" class="btn-primario" id="btnSalvar">
                        <i class="fas fa-save"></i> Salvar Anúncio
                    </button>
                </form>
            </div>
        </section>

        <section style="margin-top: 40px;">
            <h2 class="section-title"><i class="fas fa-car"></i> Veículos Ativos</h2>
            
            <div class="estoque-admin-grid" id="listaAdmin">
                <div class="admin-card">
                    <span class="status-badge publicado">publicado</span>
                    <img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800" alt="Carro">
                    <div class="admin-card-body">
                        <h3>Chevrolet Onix LTZ (2019)</h3>
                        <p>R$ 58.900</p>
                        <div class="admin-actions">
                            <button class="btn-action btn-despublicar" onclick="despublicarVeiculoMock()"><i class="fas fa-cloud-download-alt"></i> Despublicar</button>
                            <button class="btn-action btn-editar" onclick="editarVeiculoMock()"><i class="fas fa-edit"></i> Editar</button>
                            <button class="btn-action btn-excluir" onclick="excluirVeiculoMock()"><i class="fas fa-trash"></i> Excluir</button>
                        </div>
                    </div>
                </div>
                </div>
        </section>

    </main>

    <script>
        // ====================================================================
        // AQUI ENTRARÁ A SUA CONEXÃO COM O FIREBASE (initializeApp, getFirestore, etc)
        // ====================================================================

        // Função de pré-visualização de miniaturas com gerenciamento (Drag, Reorder, Remove)
        let listaFotosLocal = []; // Gerencia a lista de fotos localmente antes do upload

        function previewImagens(event) {
            const container = document.getElementById('preview-container');
            container.innerHTML = ''; // Limpa previews antigos
            const files = event.target.files;
            listaFotosLocal = Array.from(files); // Copia os arquivos para a lista local

            // Cria os elementos visuais para a lista atual
            listaFotosLocal.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const wrapper = document.createElement('div');
                    wrapper.classList.add('preview-item-wrapper');
                    wrapper.draggable = true; // Habilita Drag & Drop
                    wrapper.dataset.index = index;

                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.classList.add('preview-item');
                    
                    // Botão "X" para remover foto da lista
                    const btnRemove = document.createElement('button');
                    btnRemove.innerHTML = '&times;';
                    btnRemove.classList.add('btn-remove-foto');
                    btnRemove.title = "Remover foto";
                    btnRemove.onclick = function(e) {
                        e.stopPropagation(); // Impede o clique de ativar a área de upload
                        removerFoto(index);
                    };

                    wrapper.appendChild(img);
                    wrapper.appendChild(btnRemove);
                    container.appendChild(wrapper);

                    // Adiciona eventos Drag & Drop para ordenação
                    wrapper.addEventListener('dragstart', dragStart);
                    wrapper.addEventListener('dragover', dragOver);
                    wrapper.addEventListener('drop', dragDrop);
                    wrapper.addEventListener('dragend', dragEnd);
                }
                reader.readAsDataURL(file);
            });
        }

        function removerFoto(index) {
            listaFotosLocal.splice(index, 1); // Remove o arquivo da lista local
            atualizarVisualizacaoFotos(); // Refaz a pré-visualização com a nova lista
        }

        function atualizarVisualizacaoFotos() {
            // Recria a lista de fotos visuais com base na listaFotosLocal atualizada
            const container = document.getElementById('preview-container');
            container.innerHTML = ''; // Limpa

            listaFotosLocal.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const wrapper = document.createElement('div');
                    wrapper.classList.add('preview-item-wrapper');
                    wrapper.draggable = true;
                    wrapper.dataset.index = index;

                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.classList.add('preview-item');
                    
                    const btnRemove = document.createElement('button');
                    btnRemove.innerHTML = '&times;';
                    btnRemove.classList.add('btn-remove-foto');
                    btnRemove.onclick = function(e) {
                        e.stopPropagation();
                        removerFoto(index);
                    };

                    wrapper.appendChild(img);
                    wrapper.appendChild(btnRemove);
                    container.appendChild(wrapper);

                    wrapper.addEventListener('dragstart', dragStart);
                    wrapper.addEventListener('dragover', dragOver);
                    wrapper.addEventListener('drop', dragDrop);
                    wrapper.addEventListener('dragend', dragEnd);
                }
                reader.readAsDataURL(file);
            });
        }

        // --- Lógica Drag & Drop NATIVA para Reordenação ---
        let dragSrcEl;
        function dragStart(e) {
            this.classList.add('dragging');
            dragSrcEl = this;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.index); // Salva o índice original
        }
        function dragOver(e) {
            e.preventDefault(); // Necessário para permitir o drop
            e.dataTransfer.dropEffect = 'move';
            return false;
        }
        function dragDrop(e) {
            e.preventDefault();
            const sourceIndex = dragSrcEl.dataset.index;
            const targetIndex = this.dataset.index;

            // Se for o mesmo elemento, não faz nada
            if (sourceIndex === targetIndex) return;

            // Reordena na listaFotosLocal (mock, sem upload real ainda)
            const item = listaFotosLocal.splice(sourceIndex, 1)[0]; // Remove da origem
            listaFotosLocal.splice(targetIndex, 0, item); // Insere na nova posição

            console.log("Mock: Nova ordem das fotos:", listaFotosLocal);

            // Importante: No front, apenas reordenamos na lista local. A pré-visualização não muda visualmente com Drag & Drop (isso exigiria lógica mais complexa de manipulação de DOM). O salvamento final no Firebase saberá a ordem correta porque usará listaFotosLocal atualizada.
        }
        function dragEnd(e) {
            this.classList.remove('dragging');
        }

        // Função principal ativada ao clicar em "Salvar Anúncio"
        async function salvarVeiculo(event) {
            event.preventDefault(); // Impede a página de recarregar
            
            // 1. Captura todos os dados do formulário
            const id = document.getElementById('veiculoId').value;
            const dadosVeiculo = {
                nome: document.getElementById('nome').value,
                marca: document.getElementById('marca').value,
                tipo: document.getElementById('tipo').value,
                preco: document.getElementById('preco').value,
                ano: document.getElementById('ano').value,
                km: document.getElementById('km').value,
                cor: document.getElementById('cor').value,
                cambio: document.getElementById('cambio').value,
                combustivel: document.getElementById('combustivel').value,
                desc: document.getElementById('descricao').value,
                status: 'rascunho', // Padrão: rascunho
            };

            // ====================================================================
            // LÓGICA DO FIREBASE AQUI:
            // ====================================================================
            // Passo A: Se listaFotosLocal.length > 0, fazer upload pro Firebase Storage
            // Passo B: Receber as URLs geradas pelo Storage na ordem correta (listaFotosLocal reordenada) e adicionar ao objeto dadosVeiculo (ex: dadosVeiculo.fotos = [url1, url2])
            // Passo C: Se 'id' estiver vazio -> addDoc(collection(db, "veiculos"), dadosVeiculo)
            // Passo D: Se 'id' estiver preenchido -> updateDoc(doc(db, "veiculos", id), dadosVeiculo)
            
            console.log("Dados prontos para o Firebase:", dadosVeiculo);
            alert("Rascunho salvo com sucesso! No front-end o fluxo está pronto, aguardando ligação com o Firebase.");
            
            // Limpa o formulário e os previews após salvar
            document.getElementById('formVeiculo').reset();
            document.getElementById('preview-container').innerHTML = '';
            document.getElementById('veiculoId').value = '';
            listaFotosLocal = [];
        }

        // Função de busca automática por placa integrada com APIBrasil
        async function buscarPorPlaca() {
            const placaInput = document.getElementById('placa');
            // Remove traços/espaços e deixa tudo em maiúsculo (ex: abc-1234 -> ABC1234)
            const placa = placaInput.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            const msg = document.getElementById('msgPlaca');

            if (placa.length === 7) {
                msg.style.display = 'block';
                msg.innerText = 'Buscando informações da placa...';
                msg.style.color = '#ff9e22'; // Laranja

                try {
                    const response = await fetch(`https://api.apibrasil.com.br/v2/vehicles/plate?plate=${placa}`, {
                        method: 'GET',
                        headers: {
                            // Seu Token da APIBrasil
                            'Authorization': 'Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwczovL2dhdGV3YXkuYXBpYnJhc2lsLmlvL2FwaS9vYXV0aC9leGNoYW5nZSIsImlhdCI6MTc3Mzk0NTY0OSwiZXhwIjoxODA1NDgxNjQ5LCJuYmYiOjE3NzM5NDU2NDksImp0aSI6Im45Vm5WdXVMaVpBeUl3b1oiLCJzdWIiOiIyMjQyOCIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJ1c2VyX2lkIjoxNjM2NCwiZW1haWwiOiJhcnR1ci51bWJlbGlub0BhcGlicmFzaWwuY29tLmJyIn0.lp2H_KPNfaNZVIxq09v_Ow9X46sZyKOw1xdo5g7d5GA',
                            'Content-Type': 'application/json'
                        }
                    });

                    const json = await response.json();

                    // Verifica se a API retornou erro ou não encontrou a placa
                    if (json.error || response.status !== 200) {
                        throw new Error(json.message || 'Veículo não encontrado na base de dados.');
                    }

                    // A APIBrasil pode retornar os dados dentro de "data" ou na raiz
                    const veiculo = json.data || json;

                    // 1. Preenche Nome do Veículo (Modelo)
                    const modeloApi = veiculo.modelo || veiculo.model || '';
                    if (modeloApi) document.getElementById('nome').value = modeloApi;

                    // 2. Preenche Marca (Seleciona no dropdown)
                    const marcaApi = veiculo.marca || veiculo.brand || '';
                    if (marcaApi) {
                        const selectMarca = document.getElementById('marca');
                        for (let i = 0; i < selectMarca.options.length; i++) {
                            // Compara ignorando maiúsculas/minúsculas
                            if (selectMarca.options[i].value.toUpperCase() === marcaApi.toUpperCase()) {
                                selectMarca.selectedIndex = i;
                                break;
                            }
                        }
                    }

                    // 3. Preenche Ano (Fabricação / Modelo)
                    const anoFab = veiculo.ano || veiculo.anoFabricacao || veiculo.fabrication_year || '';
                    const anoMod = veiculo.anoModelo || veiculo.model_year || '';
                    if (anoFab && anoMod) {
                        document.getElementById('ano').value = `${anoFab}/${anoMod}`;
                    } else if (anoFab) {
                        document.getElementById('ano').value = anoFab;
                    }

                    // 4. Preenche Cor
                    const corApi = veiculo.cor || veiculo.color || '';
                    if (corApi) {
                        // Converte "PRATA" para "Prata"
                        document.getElementById('cor').value = corApi.charAt(0).toUpperCase() + corApi.slice(1).toLowerCase();
                    }

                    // 5. Preenche Combustível (Seleciona no dropdown)
                    const combApi = (veiculo.combustivel || veiculo.fuel || '').toUpperCase();
                    const selectComb = document.getElementById('combustivel');
                    if (combApi.includes('ALCOOL') || combApi.includes('FLEX')) {
                        selectComb.value = 'Flex';
                    } else if (combApi.includes('GASOLINA')) {
                        selectComb.value = 'Gasolina';
                    } else if (combApi.includes('DIESEL')) {
                        selectComb.value = 'Diesel';
                    }

                    // Sucesso!
                    msg.innerText = 'Veículo encontrado e preenchido com sucesso!';
                    msg.style.color = '#25d366'; // Verde
                    
                    // Oculta a mensagem de sucesso após 4 segundos
                    setTimeout(() => { msg.style.display = 'none'; }, 4000);

                } catch (error) {
                    console.error("Erro na consulta:", error);
                    msg.innerText = 'Erro: ' + error.message;
                    msg.style.color = '#ff4c4c'; // Vermelho
                }
            } else if (placa.length > 0) {
                msg.style.display = 'block';
                msg.innerText = 'Digite a placa completa (7 caracteres)';
                msg.style.color = '#ff4c4c';
            } else {
                msg.style.display = 'none';
            }
        }

        // ====================================================================
