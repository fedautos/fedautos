<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F&D AUTOS | Painel Administrativo</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --brand-orange: #f4813f; 
            --dark-bg: #0b0e11;
            --card-bg: #161b22;
            --text-white: #ffffff;
            --text-gray: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--dark-bg); color: var(--text-white); padding-top: 100px; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 8%; background: rgba(11, 14, 17, 0.98);
            position: fixed; width: 100%; top: 0; z-index: 3000; 
            border-bottom: 2px solid var(--brand-orange); height: 80px;
        }
        .logo-container img { height: 45px; }
        .admin-badge { background: var(--brand-orange); color: black; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; margin-left: 10px; }

        .admin-container { padding: 20px 8%; }
        .form-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--brand-orange); padding: 30px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: var(--text-gray); font-size: 0.9rem; }
        
        input, select {
            padding: 14px; border-radius: 6px; border: 1px solid #2d333b; 
            background: var(--dark-bg); color: white; outline: none;
        }
        input:focus { border-color: var(--brand-orange); }

        .btn-primario { 
            background: var(--brand-orange); color: #000; padding: 14px; border-radius: 6px; 
            font-weight: bold; border: none; cursor: pointer; width: 100%; margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="F&D AUTOS" onerror="this.style.display='none'">
            <span class="admin-badge">Painel Admin</span>
        </div>
    </header>

    <main class="admin-container">
        <div class="form-card">
            <form id="formVeiculo">
                <div class="form-grid">
                    <div class="input-group">
                        <label>Placa do Veículo (Toque fora após digitar)</label>
                        <input type="text" id="placa" placeholder="Ex: ABC1234" maxlength="7" onblur="buscarPorPlaca()">
                        <span id="msgPlaca" style="font-size: 0.8rem; display: none;"></span>
                    </div>

                    <div class="input-group">
                        <label>Nome do Veículo</label>
                        <input type="text" id="nome" placeholder="Buscando...">
                    </div>

                    <div class="input-group">
                        <label>Marca</label>
                        <select id="marca">
                            <option value="">Selecione...</option>
                            <option value="CHEVROLET">Chevrolet</option>
                            <option value="FIAT">Fiat</option>
                            <option value="FORD">Ford</option>
                            <option value="HONDA">Honda</option>
                            <option value="HYUNDAI">Hyundai</option>
                            <option value="TOYOTA">Toyota</option>
                            <option value="VOLKSWAGEN">Volkswagen</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Ano</label>
                        <input type="text" id="ano" placeholder="Buscando...">
                    </div>

                    <div class="input-group">
                        <label>Cor</label>
                        <input type="text" id="cor" placeholder="Buscando...">
                    </div>

                    <div class="input-group">
                        <label>Preço</label>
                        <input type="text" id="preco" placeholder="Ex: R$ 50.000">
                    </div>
                </div>
                <button type="submit" class="btn-primario">Salvar Anúncio</button>
            </form>
        </div>
    </main>

    <script>
        async function buscarPorPlaca() {
            const placa = document.getElementById('placa').value.toUpperCase().replace('-', '');
            const msg = document.getElementById('msgPlaca');
            
            if (placa.length === 7) {
                msg.style.display = 'block';
                msg.innerText = 'Buscando na APIBrasil...';
                msg.style.color = '#f4813f';

                try {
                    const response = await fetch(`https://api.apibrasil.com.br/v2/vehicles/plate?plate=${placa}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': 'Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJodHRwczovL2dhdGV3YXkuYXBpYnJhc2lsLmlvL2FwaS9vYXV0aC9leGNoYW5nZSIsImlhdCI6MTc3Mzk0NTY0OSwiZXhwIjoxODA1NDgxNjQ5LCJuYmYiOjE3NzM5NDU2NDksImp0aSI6Im45Vm5WdXVMaVpBeUl3b1oiLCJzdWIiOiIyMjQyOCIsInBydiI6IjIzYmQ1Yzg5NDlmNjAwYWRiMzllNzAxYzQwMDg3MmRiN2E1OTc2ZjciLCJ1c2VyX2lkIjoxNjM2NCwiZW1haWwiOiJhcnR1ci51bWJlbGlub0BhcGlicmFzaWwuY29tLmJyIn0.lp2H_KPNfaNZVIxq09v_Ow9X46sZyKOw1xdo5g7d5GA',
                            'Content-Type': 'application/json'
                        }
                    });

                    const result = await response.json();
                    
                    if (result.error) {
                        throw new Error(result.message);
                    }

                    const dados = result.data;
                    document.getElementById('nome').value = dados.modelo || '';
                    document.getElementById('ano').value = dados.anoModelo || '';
                    document.getElementById('cor').value = dados.cor || '';
                    
                    // Tenta selecionar a marca automaticamente
                    const marcaApi = dados.marca.toUpperCase();
                    const selectMarca = document.getElementById('marca');
                    for (let i = 0; i < selectMarca.options.length; i++) {
                        if (marcaApi.includes(selectMarca.options[i].value)) {
                            selectMarca.selectedIndex = i;
                            break;
                        }
                    }

                    msg.innerText = 'Veículo carregado!';
                    msg.style.color = '#25d366';

                } catch (error) {
                    console.error(error);
                    msg.innerText = 'Erro ao buscar placa. Verifique o saldo ou Token.';
                    msg.style.color = '#ff4c4c';
                }
            }
        }

        document.getElementById('formVeiculo').onsubmit = (e) => {
            e.preventDefault();
            alert('Dados capturados com sucesso!');
        };
    </script>
</body>
</html>
